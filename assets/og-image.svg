<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060919"/>
      <stop offset="100%" stop-color="#0c102b"/>
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="box-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="200" cy="150" r="300" fill="#00f0ff" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1000" cy="450" r="350" fill="#8b5cf6" opacity="0.08" filter="blur(70px)"/>

  <!-- Logo Mark -->
  <rect x="100" y="90" width="70" height="70" rx="18" fill="url(#cyan-purple)"/>
  <text x="135" y="137" text-anchor="middle" font-family="'Ubuntu Sans Mono', monospace" font-size="34" font-weight="800" fill="#ffffff">CD</text>

  <!-- Category Eyebrow -->
  <text x="195" y="133" font-family="'Ubuntu Sans Mono', monospace" font-size="22" font-weight="700" fill="#00f0ff" letter-spacing="2">$_ SOFTWARE ENGINEERING DOSSIER</text>

  <!-- Name -->
  <text x="100" y="240" font-family="'Ubuntu Sans Mono', monospace" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-1">Chiranjib Dash</text>

  <!-- Title / Specialization -->
  <text x="100" y="305" font-family="'Ubuntu Sans Mono', monospace" font-size="34" font-weight="700" fill="#00f0ff">Java Backend Developer &amp; Cloud Architect</text>
  <text x="100" y="355" font-family="'Ubuntu Sans Mono', monospace" font-size="24" font-weight="400" fill="#94a3b8">4+ Years Building Scalable Distributed Systems &amp; AWS Microservices</text>

  <!-- Metric Badges Box -->
  <g transform="translate(100, 420)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="100" rx="12" fill="rgba(16, 22, 58, 0.8)" stroke="url(#box-border)" stroke-width="1.5"/>
    <text x="25" y="45" font-family="'Ubuntu Sans Mono', monospace" font-size="32" font-weight="800" fill="#00f0ff">1M+ TPS</text>
    <text x="25" y="78" font-family="'Ubuntu Sans Mono', monospace" font-size="16" font-weight="600" fill="#94a3b8">Daily Event Volume</text>

    <!-- Badge 2 -->
    <rect x="250" y="0" width="220" height="100" rx="12" fill="rgba(16, 22, 58, 0.8)" stroke="url(#box-border)" stroke-width="1.5"/>
    <text x="275" y="45" font-family="'Ubuntu Sans Mono', monospace" font-size="32" font-weight="800" fill="#00ff9d">99.99%</text>
    <text x="275" y="78" font-family="'Ubuntu Sans Mono', monospace" font-size="16" font-weight="600" fill="#94a3b8">Uptime Availability</text>

    <!-- Badge 3 -->
    <rect x="500" y="0" width="220" height="100" rx="12" fill="rgba(16, 22, 58, 0.8)" stroke="url(#box-border)" stroke-width="1.5"/>
    <text x="525" y="45" font-family="'Ubuntu Sans Mono', monospace" font-size="32" font-weight="800" fill="#8b5cf6">-60%</text>
    <text x="525" y="78" font-family="'Ubuntu Sans Mono', monospace" font-size="16" font-weight="600" fill="#94a3b8">Query Latency Cut</text>

    <!-- Badge 4 -->
    <rect x="750" y="0" width="250" height="100" rx="12" fill="rgba(0, 255, 157, 0.08)" stroke="#00ff9d" stroke-width="1.5"/>
    <text x="775" y="45" font-family="'Ubuntu Sans Mono', monospace" font-size="24" font-weight="800" fill="#00ff9d">AVAILABLE FOR HIRE</text>
    <text x="775" y="78" font-family="'Ubuntu Sans Mono', monospace" font-size="16" font-weight="600" fill="#94a3b8">contact@chiranjibdash.com</text>
  </g>
</svg>

